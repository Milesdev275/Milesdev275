  <text class="letter" x="358" y="105" style="animation-delay:1.04s">i</text>
  <text class="letter" x="371" y="105" style="animation-delay:1.13s">l</text>
  <text class="letter" x="381" y="105" style="animation-delay:1.22s">v</text>
  <text class="letter" x="405" y="105" style="animation-delay:1.31s">a</text>

  <text class="sub-letter" x="68" y="152" style="animation-delay:1.55s">M</text>
  <text class="sub-letter" x="80" y="152" style="animation-delay:1.61s">i</text>
  <text class="sub-letter" x="86" y="152" style="animation-delay:1.67s">l</text>
