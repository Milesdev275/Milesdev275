<svg width="100%" viewBox="0 0 680 200" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Banner GitHub - Lucas Souto Silva</title>
  <desc>Banner animado com gradiente azul piscina e violeta</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="45%" style="stop-color:#1a1040"/>
      <stop offset="100%" style="stop-color:#0d2a3a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b6bff"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="waveTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="waveBot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2fff;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.2"/>
    </linearGradient>
    <style>
      .letter {
        font-family: 'Segoe UI', sans-serif;
        font-size: 42px;
        font-weight: 700;
        fill: url(#textGrad);
        opacity: 0;
        animation: fadeIn 0.12s ease forwards;
      }
      .sub-letter {
        font-family: 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #8b9ab8;
        opacity: 0;
        animation: fadeIn 0.1s ease forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .dot { fill: #00d4ff; opacity: 0; animation: fadeIn 0.1s ease forwards; }
    </style>
  </defs>

  <rect width="680" height="200" fill="url(#bgGrad)" rx="0"/>
  <path d="M0,0 Q170,60 340,20 Q510,-20 680,40 L680,0 L0,0 Z" fill="url(#waveTop)"/>
  <path d="M0,160 Q170,140 340,170 Q510,200 680,155 L680,200 L0,200 Z" fill="url(#waveBot)"/>

  <circle cx="60" cy="40" r="18" fill="#00d4ff" fill-opacity="0.06"/>
  <circle cx="620" cy="160" r="28" fill="#7b2fff" fill-opacity="0.08"/>
  <circle cx="600" cy="30" r="10" fill="#c084fc" fill-opacity="0.1"/>
  <circle cx="80" cy="170" r="14" fill="#00d4ff" fill-opacity="0.07"/>
  <line x1="40" y1="130" x2="640" y2="130" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.15"/>

  <text class="letter" x="68" y="105" style="animation-delay:0.05s">L</text>
  <text class="letter" x="95" y="105" style="animation-delay:0.14s">u</text>
  <text class="letter" x="120" y="105" style="animation-delay:0.23s">c</text>
  <text class="letter" x="143" y="105" style="animation-delay:0.32s">a</text>
  <text class="letter" x="168" y="105" style="animation-delay:0.41s">s</text>
  <text class="letter" x="204" y="105" style="animation-delay:0.5s">S</text>
  <text class="letter" x="229" y="105" style="animation-delay:0.59s">o</text>
  <text class="letter" x="256" y="105" style="animation-delay:0.68s">u</text>
  <text class="letter" x="281" y="105" style="animation-delay:0.77s">t</text>
