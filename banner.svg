  <text class="dot" x="170" y="152" style="animation-delay:2.22s;font-family:'Segoe UI',sans-serif;font-size:16px">•</text>
  <text class="sub-letter" x="183" y="152" style="animation-delay:2.3s">D</text>
  <text class="sub-letter" x="194" y="152" style="animation-delay:2.35s">e</text>
